---
layout: default
title: Game Details
permalink: /game/
---

<main class="game-detail-page" id="game-detail-page">
  <a class="game-detail-back" href="{{ '/scores/' | relative_url }}">&larr; Back to Scores</a>
  <h1 id="game-detail-title" hidden>Game Details</h1>
  <p class="game-detail-status" id="game-detail-status" role="status" aria-live="polite">Loading game sheet...</p>
  <div id="game-detail-content"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
<script>
(() => {
  const API_URL = 'https://score-sheet.portland.hockey/';
  const STATS_API_URL = {{ site.data.team_config.stats_api_url | jsonify }};
  const TEAM_STATS_API_URL = {{ site.data.team_config.team_stats_api_url | jsonify }};
  const TEAM_STATS_SUBSEASON = {{ site.data.team_config.team_stats_subseason | jsonify }};
  const params = new URLSearchParams(window.location.search);
  const gameId = params.get('id');
  const returnDate = params.get('returnDate');
  const backLink = document.querySelector('.game-detail-back');
  if (backLink && /^\d{4}-\d{2}-\d{2}$/.test(returnDate || '')) {
    const backUrl = new URL(backLink.href, window.location.href);
    backUrl.searchParams.set('date', returnDate);
    backLink.href = backUrl.toString();
  }
  const content = document.getElementById('game-detail-content');
  const status = document.getElementById('game-detail-status');
  const title = document.getElementById('game-detail-title');
  const leagues = window.siteLeagueStructure || {};
  const themePrimaryColors = new Map();
  const statsRequests = new Map();

  function fetchStats(url) {
    const key = String(url);
    if (!statsRequests.has(key)) statsRequests.set(key, fetch(url).then(response => {
      if (!response.ok) throw new Error(`Stats request failed (${response.status}).`);
      return response.json();
    }));
    return statsRequests.get(key);
  }

  function teamStatsUrl() {
    if (!TEAM_STATS_API_URL) throw new Error('Team statistics are not configured.');
    const url = new URL(TEAM_STATS_API_URL, window.location.href);
    url.searchParams.set('subseason', TEAM_STATS_SUBSEASON);
    return url;
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[character]);
  }

  function normalize(value) {
    return String(value || '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  function configuredTeam(name) {
    const normalized = normalize(name);
    const teams = Object.values(leagues).flatMap(league => league.teams || []);
    return teams.find(team => [team.name, team.id, ...(team.statsAliases || [])].some(value => normalize(value) === normalized)) ||
      teams.find(team => [team.name, team.id, ...(team.statsAliases || [])].some(value => {
        const candidate = normalize(value);
        return candidate && normalized && (normalized.includes(candidate) || candidate.includes(normalized));
      }));
  }

  function configuredTeamEntry(name) {
    const resolved = configuredTeam(name);
    if (!resolved) return null;
    const entry = Object.entries(leagues).find(([, league]) => (league.teams || []).includes(resolved));
    return entry ? { ...resolved, leagueKey: entry[0] } : null;
  }

  function teamLogo(team) {
    const config = configuredTeam(team.name);
    const path = config?.imagePath || window.pageTeamLogos?.[team.name] || window.pageTeamLogos?.default || '';
    return window.siteAssetUrl(path);
  }

  function decodeIcsUrl(value) {
    let decoded = String(value || '');
    for (let pass = 0; pass < 3; pass += 1) {
      try {
        const next = decodeURIComponent(decoded);
        if (next === decoded) break;
        decoded = next;
      } catch (_) { break; }
    }
    return decoded;
  }

  function extractGameIdFromIcs(vevent) {
    const values = ['url', 'description', 'uid'].map(key => String(vevent.getFirstPropertyValue(key) || ''));
    for (const value of values) {
      const id = decodeIcsUrl(value).match(/\/game\/(?:game_sheet|show)\/(\d+)/i)?.[1];
      if (id) return id;
    }
    for (const value of values) {
      const id = decodeIcsUrl(value).match(/[?&](?:game[_-]?id|gameid)=(\d+)/i)?.[1];
      if (id) return id;
    }
    return null;
  }

  function getTeamsInTitle(title, leagueKey) {
    const normalizedTitle = normalize(title);
    const teams = leagueKey && leagues[leagueKey]
      ? (leagues[leagueKey].teams || []).map(team => ({ ...team, leagueKey }))
      : Object.entries(leagues).flatMap(([key, league]) => (league.teams || []).map(team => ({ ...team, leagueKey: key })));
    return teams.map(team => {
      const positions = [team.name, team.id, team.abbreviation, ...(team.statsAliases || [])]
        .map(normalize)
        .filter(alias => alias.length >= 3)
        .map(alias => normalizedTitle.indexOf(alias))
        .filter(position => position >= 0);
      return positions.length ? { ...team, matchPosition: Math.min(...positions) } : null;
    }).filter(Boolean).sort((left, right) => left.matchPosition - right.matchPosition);
  }

  function sameConfiguredTeam(left, right) {
    return normalize(left?.id || left?.name) === normalize(right?.id || right?.name);
  }

  function localDateKey(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  async function findScheduledGame() {
    const requestedDate = params.get('date');
    const teamNames = [params.get('team1'), params.get('team2')];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(requestedDate || '') || teamNames.some(name => !name)) return null;
    const targetTeams = teamNames.map(configuredTeamEntry);
    if (targetTeams.some(team => !team)) return null;
    const leagueKey = params.get('league') || targetTeams[0].leagueKey;
    const url = leagues[leagueKey]?.icsUrl;
    if (!url) return null;
    const response = await fetch(url);
    if (!response.ok) throw new Error(`Schedule feed failed (${response.status}).`);
    const component = new ICAL.Component(ICAL.parse(await response.text()));
    const events = component.getAllSubcomponents('vevent').map(vevent => {
      const event = new ICAL.Event(vevent);
      const start = event.startDate?.toJSDate();
      const teams = getTeamsInTitle(event.summary, leagueKey);
      return { vevent, event, start, teams };
    });
    const selected = events.find(({ vevent, start, teams }) => {
      if (!start || localDateKey(start) !== requestedDate || teams.length !== 2) return false;
      const id = extractGameIdFromIcs(vevent);
      if (gameId && id && String(id) !== String(gameId)) return false;
      return targetTeams.every(team => teams.some(candidate => sameConfiguredTeam(team, candidate)));
    });
    if (!selected) return null;
    return {
      gameId: extractGameIdFromIcs(selected.vevent) || gameId,
      start: selected.start,
      title: selected.event.summary,
      location: selected.event.location || 'TBD',
      upcoming: true,
      status: 'Scheduled',
      date: selected.start.toLocaleDateString([], { month: 'short', day: '2-digit', year: 'numeric' }),
      time: selected.start.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }),
      teams: selected.teams.map((team, index) => ({
        name: team.name,
        side: index === 0 ? 'away' : 'home',
        score: null,
        shotsOnGoal: null,
        periods: {}
      }))
    };
  }

  async function fetchSeasonGames(currentGame, gameTeams) {
    const currentTeamConfigs = gameTeams.map(team => configuredTeamEntry(team.name)).filter(Boolean);
    const leagueKeys = [...new Set(currentTeamConfigs.map(team => team.leagueKey))];
    const feeds = await Promise.all(leagueKeys.map(async leagueKey => {
      const url = leagues[leagueKey]?.icsUrl;
      if (!url) return [];
      const response = await fetch(url);
      if (!response.ok) throw new Error(`Schedule feed failed (${response.status}).`);
      const component = new ICAL.Component(ICAL.parse(await response.text()));
      return component.getAllSubcomponents('vevent').map(vevent => {
        const event = new ICAL.Event(vevent);
        const matchedTeams = getTeamsInTitle(event.summary, leagueKey);
        if (matchedTeams.length !== 2 || !currentTeamConfigs.every(team => matchedTeams.some(candidate => sameConfiguredTeam(team, candidate)))) return null;
        return {
          title: event.summary,
          start: event.startDate.toJSDate(),
          gameId: extractGameIdFromIcs(vevent),
          teams: matchedTeams
        };
      }).filter(Boolean);
    }));
    return feeds.flat().sort((left, right) => left.start - right.start);
  }

  async function fetchSeriesGameSheet(event, currentGame) {
    if (!event.gameId) return null;
    if (String(event.gameId) === String(currentGame.gameId)) return currentGame;
    const response = await fetch(`${API_URL}?id=${encodeURIComponent(event.gameId)}`);
    if (!response.ok) throw new Error(`Game sheet request failed (${response.status}).`);
    return response.json();
  }

  function renderSeasonSeriesCard(event, sheet) {
    const isPast = event.start < new Date();
    const scores = sheet?.teams || [];
    const formatDate = event.start.toLocaleDateString([], { month: 'short', day: 'numeric' }).toUpperCase();
    const rows = event.teams.map(team => {
      const scoreTeam = scores.find(candidate => sameConfiguredTeam(configuredTeamEntry(candidate.name), team));
      const score = isPast ? (scoreTeam?.score ?? '—') : '';
      const otherScore = isPast ? Number(scores.find(candidate => !sameConfiguredTeam(configuredTeamEntry(candidate.name), team))?.score) : NaN;
      const numericScore = Number(score);
      const resultClass = Number.isFinite(numericScore) && Number.isFinite(otherScore)
        ? (numericScore > otherScore ? 'is-winner' : numericScore < otherScore ? 'is-loser' : '')
        : '';
      return `<div class="game-detail-series-team ${resultClass}">
        <img src="${escapeHtml(window.siteAssetUrl(team.imagePath || window.pageTeamLogos?.[team.name] || window.pageTeamLogos?.default || ''))}" alt="">
        <strong>${escapeHtml(team.abbreviation || team.name)}</strong>
        ${isPast ? `<b>${escapeHtml(score)}</b>` : ''}
      </div>`;
    }).join('');
    const resultStatus = isPast ? (sheet?.status || 'FINAL') : '';
    return `<article class="game-detail-series-card">
      <div class="game-detail-series-matchup">${rows}</div>
      <div class="game-detail-series-footer"><span>${escapeHtml(resultStatus)}</span><time>${escapeHtml(formatDate)}</time></div>
    </article>`;
  }

  async function loadSeasonSeries(currentGame, gameTeams) {
    const container = document.getElementById('game-detail-season-series');
    if (!container || gameTeams.length !== 2) return;
    try {
      const events = await fetchSeasonGames(currentGame, gameTeams);
      if (!events.length) {
        container.innerHTML = '<p class="game-detail-muted">No other games found for this matchup.</p>';
        return;
      }
      const results = await Promise.all(events.map(async event => {
        if (event.start >= new Date()) return { event, sheet: null };
        try { return { event, sheet: await fetchSeriesGameSheet(event, currentGame) }; }
        catch (error) {
          console.warn(`Could not load season series score for game ${event.gameId || 'unknown'}:`, error);
          return { event, sheet: null };
        }
      }));
      const [firstTeam, secondTeam] = gameTeams.map(team => configuredTeamEntry(team.name));
      const record = results.reduce((totals, { event, sheet }) => {
        if (event.start >= new Date() || !sheet?.teams) return totals;
        const first = sheet.teams.find(candidate => sameConfiguredTeam(configuredTeamEntry(candidate.name), firstTeam));
        const second = sheet.teams.find(candidate => sameConfiguredTeam(configuredTeamEntry(candidate.name), secondTeam));
        if (!first || !second || first.score === null || first.score === undefined || second.score === null || second.score === undefined ||
          !Number.isFinite(Number(first.score)) || !Number.isFinite(Number(second.score))) return totals;
        totals.completed += 1;
        if (Number(first.score) > Number(second.score)) totals.firstWins += 1;
        else if (Number(second.score) > Number(first.score)) totals.secondWins += 1;
        return totals;
      }, { firstWins: 0, secondWins: 0, completed: 0 });
      const summary = !record.completed
        ? (results.some(result => result.event.start < new Date()) ? 'Results unavailable' : 'No completed games')
        : record.firstWins === record.secondWins
          ? `Tied ${record.firstWins}-${record.secondWins}`
          : `${escapeHtml((record.firstWins > record.secondWins ? firstTeam : secondTeam)?.abbreviation || '')} leads ${Math.max(record.firstWins, record.secondWins)}-${Math.min(record.firstWins, record.secondWins)}`;
      container.innerHTML = `<div class="game-detail-season-heading"><h2>Season Series</h2><span>${summary}</span></div>
        <div class="game-detail-season-grid">${results.map(({ event, sheet }) => renderSeasonSeriesCard(event, sheet)).join('')}</div>`;
    } catch (error) {
      console.error('Could not load season series:', error);
      container.innerHTML = '<p class="game-detail-muted">Season series could not be loaded.</p>';
    }
  }

  function playerTeamEntry(player) {
    const candidates = [player.teamName, player.team_name, player.team, player.Team, player.teamId, player.team_id, player.teamKey, player.franchise, player.teamAbbreviation];
    for (const candidate of candidates) {
      const value = candidate && typeof candidate === 'object'
        ? (candidate.name || candidate.fullName || candidate.teamName || candidate.id || candidate.abbreviation)
        : String(candidate || '').includes(':') ? String(candidate).split(':').pop() : candidate;
      const entry = configuredTeamEntry(value);
      if (entry) return entry;
    }
    return null;
  }

  function metricValue(player, metric) {
    const aliases = {
      points: ['pts', 'points', 'PTS'],
      goals: ['g', 'goals', 'G'],
      assists: ['a', 'assists', 'A']
    }[metric];
    const value = aliases.map(key => player[key]).find(item => item !== undefined && item !== null && item !== '');
    return Number(value || 0);
  }

  function renderPlayersToWatch(skaters, teams) {
    const pointsPerGame = player => {
      const average = player.avgPts;
      if (average !== null && average !== undefined && average !== '' && Number.isFinite(Number(average))) return Number(average);
      const games = Number(player.gp);
      return games > 0 ? metricValue(player, 'points') / games : 0;
    };
    const metrics = [
      ['points', 'Points'], ['goals', 'Goals'], ['goals', 'Goals', 1], ['assists', 'Assists']
    ];
    const teamPlayers = teams.map(team => {
      const config = configuredTeamEntry(team.name);
      return skaters.filter(player => sameConfiguredTeam(playerTeamEntry(player), config));
    });
    return metrics.map(([metric, label, leaderIndex = 0]) => {
      const leaders = teamPlayers.map(players => [...players].sort((left, right) =>
        metricValue(right, metric) - metricValue(left, metric) || pointsPerGame(right) - pointsPerGame(left)
      )[leaderIndex] || null);
      const values = leaders.map(player => player ? metricValue(player, metric) : 0);
      const total = values[0] + values[1];
      const shares = total ? [values[0] / total, values[1] / total] : [0.5, 0.5];
      const playerMarkup = (player, team, side) => player
        ? `<div class="game-detail-watch-player ${side}">
            <img src="${escapeHtml(teamLogo(team))}" alt="">
            <div><strong>${escapeHtml(player.name || 'Player')}</strong><span>${player.number ? `#${escapeHtml(player.number)}` : ''}${player.position || player.pos ? ` · ${escapeHtml(player.position || player.pos)}` : ''}</span></div>
          </div>`
        : `<div class="game-detail-watch-player ${side} unavailable"><img src="${escapeHtml(teamLogo(team))}" alt=""><div><strong>Player stats unavailable</strong></div></div>`;
      return `<div class="game-detail-watch-stat">
        <div class="game-detail-watch-stat-line">
          ${playerMarkup(leaders[0], teams[0], 'away')}
          <strong class="game-detail-watch-value">${values[0]}</strong>
          <span class="game-detail-watch-label">${label}</span>
          <strong class="game-detail-watch-value">${values[1]}</strong>
          ${playerMarkup(leaders[1], teams[1], 'home')}
        </div>
        <div class="game-detail-stat-bars" aria-hidden="true">
          <span class="game-detail-stat-bar-away" style="--bar-share:${shares[0]};--bar-color:${escapeHtml(teamPrimaryColor(teams[0]))}"></span>
          <span class="game-detail-stat-bar-home" style="--bar-share:${shares[1]};--bar-color:${escapeHtml(teamPrimaryColor(teams[1]))}"></span>
        </div>
      </div>`;
    }).join('');
  }

  async function loadPlayersToWatch(teams) {
    const target = document.getElementById('game-detail-watch-content');
    if (!target) return;
    try {
      const data = await fetchStats(STATS_API_URL);
      const skaters = Array.isArray(data.skaters) ? data.skaters : [];
      target.innerHTML = skaters.length
        ? renderPlayersToWatch(skaters, teams)
        : '<p class="game-detail-muted">Player statistics are unavailable.</p>';
    } catch (error) {
      console.error('Could not load players to watch:', error);
      target.innerHTML = '<p class="game-detail-muted">Player statistics could not be loaded.</p>';
    }
  }

  function renderGoaltending(goalies, teams) {
    const goalieName = player => String(player.name || 'Goalie')
      .replace(/(?:\*|\s|&(?:#x0*a0|#0*160|nbsp);)*-\s*\(G\)(?:\*|\s)*$/i, '').trim();
    const format = (value, key) => {
      if (value === null || value === undefined || value === '' || !Number.isFinite(Number(value))) return '&mdash;';
      const number = Number(value);
      return key === 'gaa' ? number.toFixed(2) : key === 'svPct' ? number.toFixed(3).replace(/^0/, '') : String(number);
    };
    const cells = stats => [['gp', 'GP'], ['gaa', 'GAA'], ['svPct', 'SV%'], ['so', 'SO']].map(([key, label]) =>
      `<div class="game-detail-goalie-metric"><strong>${format(stats?.[key], key)}</strong><span>${label}</span></div>`).join('');
    return teams.map(team => {
      const config = configuredTeamEntry(team.name);
      const matches = entry => config && entry?.leagueKey === config.leagueKey && sameConfiguredTeam(entry, config);
      const players = goalies.filter(player => matches(playerTeamEntry(player))).sort((a, b) => Number(b.gp || 0) - Number(a.gp || 0));
      return `<div class="game-detail-goalie-team">
        ${players.length ? players.map(player => `<div class="game-detail-goalie-row">
          <div class="game-detail-goalie-name"><img src="${escapeHtml(teamLogo(team))}" alt="${escapeHtml(team.name)}"><div><strong>${escapeHtml(goalieName(player))}</strong>${player.number ? `<span>#${escapeHtml(player.number)}</span>` : ''}</div></div>
          ${cells(player)}
        </div>`).join('') : `<p class="game-detail-muted">Goalie statistics are unavailable for ${escapeHtml(team.name)}.</p>`}
      </div>`;
    }).join('');
  }

  async function loadGoaltending(teams) {
    const target = document.getElementById('game-detail-goaltending-content');
    if (!target) return;
    try {
      const data = await fetchStats(STATS_API_URL);
      target.innerHTML = renderGoaltending(Array.isArray(data.goalies) ? data.goalies : [], teams);
    } catch (error) {
      console.error('Could not load goaltending statistics:', error);
      target.innerHTML = '<p class="game-detail-muted">Goaltending statistics could not be loaded.</p>';
    }
  }

  function renderTeamStats(rows, teams) {
    const metrics = [
      { key: 'ppPct', label: 'Power Play %', percent: true },
      { key: 'pkPct', label: 'Penalty Kill %', percent: true },
      { key: 'gpg', label: 'GF/GP' },
      { key: 'gapg', label: 'GA/GP', ascending: true }
    ];
    const entries = rows.map(row => ({ row, config: configuredTeamEntry(row.name) }));
    const configs = teams.map(team => configuredTeamEntry(team.name));
    const selected = configs.map(config => config && entries.find(entry => entry.config?.leagueKey === config.leagueKey && sameConfiguredTeam(entry.config, config)));
    const valueOf = (entry, key) => {
      // Fall 2026 Novice totals include six extra games in the GP count.
      if (String(TEAM_STATS_SUBSEASON) === '964738' && entry?.config?.leagueKey === 'novice' && ['gpg', 'gapg'].includes(key)) {
        const stats = entry.row.stats;
        const gamesPlayed = Number(stats?.team?.gp) - 6;
        const total = key === 'gpg' ? stats?.skater?.goals : stats?.goalie?.ga;
        return gamesPlayed > 0 && total !== null && total !== undefined && total !== '' && Number.isFinite(Number(total))
          ? Number(total) / gamesPlayed
          : null;
      }
      const value = entry?.row.stats?.team?.[key];
      return value !== null && value !== undefined && value !== '' && Number.isFinite(Number(value)) ? Number(value) : null;
    };
    const ordinal = rank => `${rank}${rank % 100 >= 11 && rank % 100 <= 13 ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[rank % 10] || 'th')}`;
    if (!selected.some(entry => metrics.some(metric => valueOf(entry, metric.key) !== null))) {
      return '<p class="game-detail-muted">Team statistics are unavailable for this matchup.</p>';
    }
    return metrics.map(metric => {
      const values = selected.map(entry => valueOf(entry, metric.key));
      const total = values.reduce((sum, value) => sum + Math.max(0, value ?? 0), 0);
      const shares = values.every(value => value !== null)
        ? (total ? values.map(value => Math.max(0, value) / total) : [0.5, 0.5])
        : [0, 0];
      if (metric.ascending) shares.reverse();
      const ranks = selected.map((entry, index) => {
        if (values[index] === null || !entry?.config) return 'Rank unavailable';
        const peers = entries.filter(peer => peer.config?.leagueKey === entry.config.leagueKey && valueOf(peer, metric.key) !== null);
        const better = peers.filter(peer => metric.ascending ? valueOf(peer, metric.key) < values[index] : valueOf(peer, metric.key) > values[index]).length;
        const tied = peers.filter(peer => valueOf(peer, metric.key) === values[index]).length > 1;
        return `${tied ? 'Tied ' : ''}${ordinal(better + 1)}`;
      });
      const display = values.map(value => value === null ? '&mdash;' : metric.percent ? `${value}%` : value.toFixed(2));
      return `<div class="game-detail-stat-row">
        <div class="game-detail-stat-values"><strong>${display[0]}</strong><span>${metric.label}</span><strong>${display[1]}</strong></div>
        <div class="game-detail-stat-bars" aria-hidden="true">
          <span class="game-detail-stat-bar-away" style="--bar-share:${shares[0]};--bar-color:${escapeHtml(teamPrimaryColor(teams[0]))}"></span>
          <span class="game-detail-stat-bar-home" style="--bar-share:${shares[1]};--bar-color:${escapeHtml(teamPrimaryColor(teams[1]))}"></span>
        </div>
        <div class="game-detail-stat-details"><span>${ranks[0]}</span><span>${ranks[1]}</span></div>
      </div>`;
    }).join('');
  }

  async function loadTeamStats(teams) {
    const target = document.getElementById('game-detail-team-stats-content');
    if (!target) return;
    try {
      const data = await fetchStats(teamStatsUrl());
      target.innerHTML = renderTeamStats(Array.isArray(data.teams) ? data.teams : [], teams);
    } catch (error) {
      console.error('Could not load team statistics:', error);
      target.innerHTML = '<p class="game-detail-muted">Team statistics could not be loaded.</p>';
    }
  }

  function themePrimaryColor(themeId) {
    if (!themeId) return getComputedStyle(document.documentElement).getPropertyValue('--primary').trim();
    if (themePrimaryColors.has(themeId)) return themePrimaryColors.get(themeId);
    const root = document.documentElement;
    const previousTheme = root.getAttribute('data-site-theme');
    if (themeId === 'green') root.removeAttribute('data-site-theme');
    else root.setAttribute('data-site-theme', themeId);
    const color = getComputedStyle(root).getPropertyValue('--primary').trim();
    if (previousTheme === null) root.removeAttribute('data-site-theme');
    else root.setAttribute('data-site-theme', previousTheme);
    themePrimaryColors.set(themeId, color);
    return color;
  }

  function teamPrimaryColor(team) {
    const config = configuredTeam(team.name);
    const identifiers = [config?.id, config?.name, ...(config?.statsAliases || [])].map(normalize).filter(Boolean);
    const theme = (window.siteThemeMetadata || []).find(item => {
      if (!item.statsTeamKey) return false;
      const configuredKey = normalize(String(item.statsTeamKey).split(':').slice(1).join(':'));
      return identifiers.includes(configuredKey);
    }) || (window.siteThemeMetadata || []).find(item => normalize(item.id) === normalize(config?.id));
    return themePrimaryColor(theme?.id);
  }

  function periodColumns(teams) {
    const periods = [...new Set(teams.flatMap(team => Object.keys(team.periods || {})))];
    return periods.sort((left, right) => {
      const leftNumber = Number(left);
      const rightNumber = Number(right);
      if (Number.isFinite(leftNumber) && Number.isFinite(rightNumber)) return leftNumber - rightNumber;
      if (Number.isFinite(leftNumber)) return -1;
      if (Number.isFinite(rightNumber)) return 1;
      return left.localeCompare(right, undefined, { numeric: true });
    });
  }

  async function loadSeasonRoster(teams) {
    try {
      const data = await fetchStats(STATS_API_URL);
      teams.forEach((team, index) => {
        const panel = document.getElementById(`game-roster-panel-${index}`);
        if (!panel) return;
        const config = configuredTeamEntry(team.name);
        const players = kind => (Array.isArray(data[kind]) ? data[kind] : []).filter(player => {
          const entry = playerTeamEntry(player);
          return config && entry?.leagueKey === config.leagueKey && sameConfiguredTeam(entry, config);
        });
        const roster = { skaters: players('skaters'), goalies: players('goalies') };
        panel.innerHTML = rosterTable(roster, index, 'skaters', true) + rosterTable(roster, index, 'goalies', true);
      });
      requestAnimationFrame(updateGameTableOverflow);

      console.error('Could not load season roster:', error);
      content.querySelectorAll('[data-game-roster-panel]').forEach(panel => {
        panel.innerHTML = '<p class="game-detail-muted">Roster statistics could not be loaded.</p>';
      });

  function rosterTable(team, teamIndex, kind, season = false) {
    const isSkater = kind === 'skaters';
    const players = Array.isArray(team[kind]) ? [...team[kind]] : [];
    const columns = season ? (isSkater
      ? [['number', '#', 'number'], ['name', 'Player', 'text'], ['gp', 'GP', 'number'], ['g', 'G', 'number'], ['a', 'A', 'number'], ['pts', 'PTS', 'number'], ['avgPts', 'PTS/GP', 'number'], ['pim', 'PIM', 'number'], ['ppg', 'PPG', 'number'], ['ppa', 'PPA', 'number'], ['gw', 'GWG', 'number']]
      : [['number', '#', 'number'], ['name', 'Goalie', 'text'], ['gp', 'GP', 'number'], ['w', 'W', 'number'], ['l', 'L', 'number'], ['t', 'T', 'number'], ['sog', 'SOG', 'number'], ['ga', 'GA', 'number'], ['sv', 'SV', 'number'], ['gaa', 'GAA', 'number'], ['svPct', 'SV%', 'number'], ['so', 'SO', 'number']]) : isSkater
      ? [
          ['number', '#', 'number'], ['name', 'Player', 'text'], ['goals', 'G', 'number'],
          ['assists', 'A', 'number'], ['points', 'P', 'number'], ['pim', 'PIM', 'number'], ['gwg', 'GWG', 'number']
        ]
      : [
          ['number', '#', 'number'], ['name', 'Goalie', 'text'], ['minutes', 'MIN', 'time'],
          ['shots', 'SH', 'number'], ['saves', 'SV', 'number'], ['decision', 'DEC', 'text']
        ];
    const defaultSortKey = isSkater ? (season ? 'pts' : 'points') : 'number';
    const defaultSortDirection = isSkater ? 'desc' : 'asc';
    const valueFor = (player, key) => season && key === 'name'
      ? String(player.name || '').replace(/(?:\*|\s|&(?:#x0*a0|#0*160|nbsp);)*-\s*\(G\)(?:\*|\s)*$/i, '').trim()
      : key === 'points'
      ? Number(player.goals || 0) + Number(player.assists || 0)
      : (player[key] ?? '');
    if (isSkater) {
      players.sort((left, right) => valueFor(right, defaultSortKey) - valueFor(left, defaultSortKey));
    }
    const tableKey = `${teamIndex}-${kind}`;
    const rows = players.map(player => `<tr>${columns.map(([key]) => {
      const value = valueFor(player, key);
      const displayValue = value === '' || value === null || value === undefined ? '—'
        : season && ['gaa', 'avgPts', 'svPct'].includes(key) && Number.isFinite(Number(value))
          ? (key === 'svPct' ? Number(value).toFixed(3).replace(/^0/, '') : Number(value).toFixed(2)) : value;
      return `<td data-sort-value="${escapeHtml(value)}">${escapeHtml(displayValue)}</td>`;
    }).join('')}</tr>`).join('');
    const headers = columns.map(([key, label, type], index) => `
      <th scope="col" aria-sort="${key === defaultSortKey ? (defaultSortDirection === 'asc' ? 'ascending' : 'descending') : 'none'}">
        <button type="button" class="stats-sort-button" data-roster-sort-key="${escapeHtml(key)}" data-roster-sort-type="${type}">
          ${escapeHtml(label)}<span class="sort-icon" aria-hidden="true">${key === defaultSortKey ? (defaultSortDirection === 'asc' ? '▲' : '▼') : ''}</span>
        </button>
      </th>`).join('');

    return `<section class="game-detail-roster-table">
      <h4>${isSkater ? 'Skaters' : 'Goalies'}</h4>
      <div class="stats-table-wrapper">
        <table class="stats-table game-detail-player-table" data-roster-table="${tableKey}" data-sort-key="${defaultSortKey}" data-sort-direction="${defaultSortDirection}">
          <thead><tr>${headers}</tr></thead>
          <tbody>${rows || `<tr><td colspan="${columns.length}" class="stats-table-message">${players.length ? '' : 'Player statistics are unavailable.'}</td></tr>`}</tbody>
        </table>
      </div>
    </section>`;
  }

  function sortRosterTable(button) {
    const table = button.closest('[data-roster-table]');
    if (!table) return;
    const key = button.dataset.rosterSortKey;
    const type = button.dataset.rosterSortType;
    const sameColumn = table.dataset.sortKey === key;
    const ascending = sameColumn
      ? table.dataset.sortDirection !== 'asc'
      : (type === 'text');
    const columnIndex = [...button.closest('tr').children].indexOf(button.closest('th'));
    const body = table.tBodies[0];
    const rows = [...body.rows];

    rows.sort((left, right) => {
      const leftValue = left.cells[columnIndex]?.dataset.sortValue || '';
      const rightValue = right.cells[columnIndex]?.dataset.sortValue || '';
      if (!leftValue || !rightValue) return leftValue === rightValue ? 0 : (leftValue ? -1 : 1);
      let comparison;
      if (type === 'number') comparison = Number(leftValue) - Number(rightValue);
      else if (type === 'time') {
        const seconds = value => {
          const [minutes, secs] = value.split(':').map(Number);
          return (minutes || 0) * 60 + (secs || 0);
        };
        comparison = seconds(leftValue) - seconds(rightValue);
      } else comparison = leftValue.localeCompare(rightValue, undefined, { numeric: true, sensitivity: 'base' });
      return ascending ? comparison : -comparison;
    });

    table.dataset.sortKey = key;
    table.dataset.sortDirection = ascending ? 'asc' : 'desc';
    rows.forEach(row => body.appendChild(row));
    table.querySelectorAll('thead th').forEach((header, index) => {
      const active = index === columnIndex;
      header.setAttribute('aria-sort', active ? (ascending ? 'ascending' : 'descending') : 'none');
      const icon = header.querySelector('.sort-icon');
      if (icon) icon.textContent = active ? (ascending ? '▲' : '▼') : '';
    });
  }

  async function loadTeamRecords(teams) {
    const requests = new Map();
    await Promise.all(teams.map(async (team, index) => {
      const target = document.getElementById(`game-detail-team-record-${index}`);
      if (!target) return;
      const config = configuredTeamEntry(team.name);
      const division = leagues[config?.leagueKey];
      const url = division?.standingsUrl;
      try {
        if (!url || !config) throw new Error('Team standings are not configured.');
        if (!requests.has(url)) requests.set(url, fetch(url).then(response => {
          if (!response.ok) throw new Error(`Standings request failed (${response.status}).`);
          return response.json();
        }));
        const rows = await requests.get(url);
        const row = rows.find(row => {
          const entry = configuredTeamEntry(row.Team);
          return entry?.leagueKey === config.leagueKey && sameConfiguredTeam(entry, config);
        });
        const record = ['W', 'L', 'T'].map(key => row?.[key]);
        if (record.some(value => value === null || value === undefined || String(value).trim() === '' || !Number.isFinite(Number(value)))) {
          throw new Error('Team record was not returned.');
        }
        target.textContent = record.map(Number).join('-');
        target.setAttribute('aria-label', `${record[0]} wins, ${record[1]} losses, ${record[2]} ties`);
      } catch (error) {
        console.warn(`Could not load record for ${team.name}:`, error);
        target.textContent = 'Record unavailable';
      }
    }));
  }

  function recentGameResult(sheet, config) {
    if (!sheet || !/final|completed/i.test(sheet.status || '')) return null;
    const own = (sheet.teams || []).find(team => sameConfiguredTeam(configuredTeamEntry(team.name), config));
    const opponent = (sheet.teams || []).find(team => !sameConfiguredTeam(configuredTeamEntry(team.name), config));
    const valid = value => value !== null && value !== undefined && value !== '' && Number.isFinite(Number(value));
    if (!own || !opponent || !valid(own.score) || !valid(opponent.score)) return null;
    return { opponent, own, outcome: Number(own.score) > Number(opponent.score) ? 'W' : Number(own.score) < Number(opponent.score) ? 'L' : 'T' };
  }

  async function loadRecentGames(game, teams) {
    const target = document.getElementById('game-detail-recent-content');
    if (!target) return;
    const feeds = new Map();
    const sheets = new Map();
    const cards = await Promise.all(teams.map(async team => {
      const config = configuredTeamEntry(team.name);
      try {
        const url = leagues[config?.leagueKey]?.icsUrl;
        if (!url) throw new Error('Schedule is not configured.');
        if (!feeds.has(url)) feeds.set(url, fetch(url).then(async response => {
          if (!response.ok) throw new Error(`Schedule request failed (${response.status}).`);
          return new ICAL.Component(ICAL.parse(await response.text())).getAllSubcomponents('vevent');
        }));
        const events = (await feeds.get(url)).map(vevent => {
          const event = new ICAL.Event(vevent);
          return { start: event.startDate?.toJSDate(), gameId: extractGameIdFromIcs(vevent), teams: getTeamsInTitle(event.summary, config.leagueKey) };
        }).filter(event => event.start && event.start < new Date() && event.gameId && String(event.gameId) !== String(game.gameId) && event.teams.some(candidate => sameConfiguredTeam(candidate, config)))
          .sort((a, b) => b.start - a.start);
        const results = [];
        const seen = new Set();
        for (const event of events) {
          if (seen.has(event.gameId)) continue;
          seen.add(event.gameId);
          try {
            if (!sheets.has(event.gameId)) sheets.set(event.gameId, fetchSeriesGameSheet(event, game));
            const result = recentGameResult(await sheets.get(event.gameId), config);
            if (result) results.push({ ...result, start: event.start });
          } catch (error) { console.warn('Could not load recent game:', error); }
          if (results.length === 5) break;
        }
        const count = outcome => results.filter(result => result.outcome === outcome).length;
        return `<article class="game-detail-recent-team">
          <div class="game-detail-recent-heading"><strong>${escapeHtml(team.name)}</strong><span>${count('W')}-${count('L')}-${count('T')}</span></div>
          ${results.length ? `<div class="game-detail-recent-grid">${results.map(result => {
            const opponent = configuredTeamEntry(result.opponent.name);
            const description = `${result.start.toLocaleDateString()}: ${team.name} ${result.own.score}-${result.opponent.score} ${result.opponent.name}`;
            return `<div title="${escapeHtml(description)}"><span class="game-detail-recent-badge ${result.outcome === 'W' ? 'is-win' : ''}">${escapeHtml(opponent?.abbreviation || result.opponent.name)}</span><span class="game-detail-recent-outcome">${result.outcome}</span></div>`;
          }).join('')}</div>` : '<p class="game-detail-muted">No completed games found.</p>'}
        </article>`;
      } catch (error) {
        console.warn('Could not load recent games:', error);
        return `<p class="game-detail-muted">Recent games are unavailable for ${escapeHtml(team.name)}.</p>`;
      }
    }));
    target.innerHTML = cards.join('');
  }

  async function loadCaptains(teams) {
    try {
      const data = await fetchStats(STATS_API_URL);
      const players = [...(data.skaters || []), ...(data.goalies || [])];
      teams.forEach((team, index) => {
        const config = configuredTeamEntry(team.name);
        const names = players.filter(player => {
          const entry = playerTeamEntry(player);
          return config && entry?.leagueKey === config.leagueKey && sameConfiguredTeam(entry, config) && /\(C\)/i.test(player.name || '');
        }).map(player => String(player.name).replace(/\(C\)|\(G\)|\*|&(?:#x0*a0|#0*160|nbsp);/gi, ' ').replace(/\s*-\s*$/, '').trim());
        document.getElementById(`game-detail-captains-${index}`).textContent = [...new Set(names)].join(', ') || 'Unavailable';
      });
    } catch (error) {
      console.warn('Could not load captains:', error);
      teams.forEach((_, index) => { document.getElementById(`game-detail-captains-${index}`).textContent = 'Unavailable'; });
    }
  }

  function updateGameTableOverflow() {
    content.querySelectorAll('.stats-table-wrapper').forEach(wrapper => {
      const table = wrapper.querySelector('table');
      wrapper.classList.toggle('has-horizontal-overflow', Boolean(table && table.scrollWidth > wrapper.clientWidth + 1));
    });
  }

  function updateGameBannerStickyState() {
    const banner = content.querySelector('.game-detail-banner');
    if (banner) banner.classList.toggle('is-stuck', banner.getBoundingClientRect().top <= 0);
  }

  window.addEventListener('scroll', updateGameBannerStickyState, { passive: true });
  window.addEventListener('resize', updateGameBannerStickyState);
  window.addEventListener('resize', updateGameTableOverflow, { passive: true });

  content.addEventListener('click', event => {
    const rosterTab = event.target.closest('[data-game-roster-tab]');
    if (rosterTab) {
      const selectedIndex = rosterTab.dataset.gameRosterTab;
      content.querySelectorAll('[data-game-roster-tab]').forEach(tab => {
        const selected = tab === rosterTab;
        tab.classList.toggle('active', selected);
        tab.setAttribute('aria-selected', String(selected));
      });
      content.querySelectorAll('[data-game-roster-panel]').forEach(panel => {
        panel.hidden = panel.dataset.gameRosterPanel !== selectedIndex;
      });
      requestAnimationFrame(updateGameTableOverflow);
      return;
    }
    const button = event.target.closest('[data-roster-sort-key]');
    if (button) sortRosterTable(button);
  });

  async function loadGamePage() {
    let scheduled = null;
    try {
      scheduled = await findScheduledGame();
    } catch (error) {
      console.warn('Could not look up the scheduled matchup:', error);
    }
    if (scheduled && scheduled.start >= new Date()) {
      renderGameSheet(scheduled);
      return;
    }
    try {
      if (!gameId || !/^\d+$/.test(gameId)) {
        status.hidden = false;
        status.textContent = 'This game link is missing a valid game ID.';
        return;
      }
      const response = await fetch(`${API_URL}?id=${encodeURIComponent(gameId)}`);
      if (!response.ok) throw new Error(`Game sheet request failed (${response.status}).`);
      renderGameSheet(await response.json());
    } catch (error) {
      console.error('Unable to load game details:', error);
      status.hidden = false;
      status.textContent = 'Game details could not be loaded.';
    }
  }

  loadGamePage();
})();
</script>
