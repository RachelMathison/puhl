{% assign game_page_mode = include.mode | default: "schedule" %}

<!-- iCal Dependency -->
<script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>

<h1>{% if game_page_mode == "scores" %}Scores{% else %}Schedule{% endif %}</h1>

<div id="list-view" class="view-content active">
  <div class="schedule-date-picker">
    <div class="schedule-week-nav">
      <button type="button" id="previous-schedule-week" aria-label="Previous week" onclick="shiftScheduleWeek(-1)">&lsaquo;</button>
      <span id="schedule-week-label"></span>
      <button type="button" aria-label="Next week" onclick="shiftScheduleWeek(1)">&rsaquo;</button>
    </div>
    <div id="day-selector" class="schedule-day-selector" aria-label="Upcoming game days"></div>
  </div>
  <div id="schedule-filters" class="schedule-filters">
    <label id="show-all-teams-control" class="show-all-teams-control">
      <input type="checkbox" id="show-all-teams" checked aria-controls="filter-controls" onchange="toggleShowAllTeams(this.checked)">
      <span>Show all teams</span>
    </label>
    <div id="filter-controls" class="league-filter-container" hidden></div>
  </div>
  <button type="button" id="schedule-filter-toggle" class="schedule-filter-toggle" aria-controls="schedule-filters" aria-expanded="true" onclick="toggleScheduleFilters()">Hide Filters</button>
  <div id="upcoming-games-container" data-game-view="{{ game_page_mode }}">Loading schedule...</div>
</div>

<script>
// --- Storage Keys ---
const STORAGE_KEY_LEAGUES = 'puhl_selected_leagues';
const STORAGE_KEY_TEAMS = 'puhl_selected_teams';
const STORAGE_KEY_SHOW_ALL_TEAMS = 'puhl_show_all_teams';

// --- League & Team Configurations ---
const LEAGUE_STRUCTURE = {{ site.data.league_structure | jsonify }};
const SCHEDULE_STATS_API_URL = {{ site.data.team_config.stats_api_url | jsonify }};
const SCORE_SHEET_API_URL = 'https://score-sheet.xarria.workers.dev/';
const GAME_PAGE_MODE = {{ game_page_mode | jsonify }};

const teamLogos = window.pageTeamLogos || {};
Object.values(LEAGUE_STRUCTURE).forEach(league => {
  (league.teams || []).forEach(team => {
    team.imagePath = window.siteAssetUrl(team.imagePath || teamLogos[team.name] || teamLogos.default);
  });
});

const activeLeagues = new Set();
const activeTeams = new Set();
const allTeamConfigs = [];
let showAllTeamsMode = true;

// Load state from localStorage or initialize defaults
function loadSavedFilters() {
  const savedLeagues = localStorage.getItem(STORAGE_KEY_LEAGUES);
  const savedTeams = localStorage.getItem(STORAGE_KEY_TEAMS);
  const hasSavedFilters = savedLeagues !== null || savedTeams !== null;
  const activeThemeKey = document.documentElement.dataset.siteTheme || 'green';
  const activeTheme = (window.siteThemeMetadata || []).find(theme => theme.id === activeThemeKey);
  const themeDivisionKey = activeTheme?.statsTeamKey?.split(':')[0];
  const themeDivision = !hasSavedFilters ? LEAGUE_STRUCTURE[themeDivisionKey] : null;

  if (savedLeagues !== null) {
    JSON.parse(savedLeagues).forEach(key => activeLeagues.add(key));
  } else if (themeDivision) {
    activeLeagues.add(themeDivisionKey);
  } else {
    Object.keys(LEAGUE_STRUCTURE).forEach(key => activeLeagues.add(key));
  }

  if (savedTeams !== null) {
    JSON.parse(savedTeams).forEach(name => activeTeams.add(name));
  } else if (themeDivision) {
    themeDivision.teams.forEach(team => activeTeams.add(team.name));
  } else {
    Object.values(LEAGUE_STRUCTURE).forEach(league => {
      league.teams.forEach(team => activeTeams.add(team.name));
    });
  }

  const savedShowAllTeams = localStorage.getItem(STORAGE_KEY_SHOW_ALL_TEAMS);
  const totalTeamCount = Object.values(LEAGUE_STRUCTURE).reduce((total, league) => total + league.teams.length, 0);
  showAllTeamsMode = savedShowAllTeams === null
    ? !themeDivision && activeTeams.size === totalTeamCount && activeLeagues.size === Object.keys(LEAGUE_STRUCTURE).length
    : savedShowAllTeams === 'true';
}

function saveFiltersToStorage() {
  localStorage.setItem(STORAGE_KEY_LEAGUES, JSON.stringify(Array.from(activeLeagues)));
  localStorage.setItem(STORAGE_KEY_TEAMS, JSON.stringify(Array.from(activeTeams)));
}

// Initialize structure lookups
Object.entries(LEAGUE_STRUCTURE).forEach(([leagueKey, league]) => {
  league.teams.forEach(team => {
    allTeamConfigs.push({
      displayName: team.name,
      id: String(team.id).toLowerCase(),
      abbreviation: team.abbreviation || team.name,
      statsAliases: team.statsAliases || [],
      leagueKey,
      imagePath: team.imagePath || teamLogos[team.name] || teamLogos.default
    });
  });
});

// Match team IDs as whole words so an ID that happens to be part of another
// event title cannot make that event pass the selected-team filter.
function getMatchupDetails(title, leagueKey) {
  if (!title) return { selfLogo: teamLogos.default, oppLogo: teamLogos.default, team1Name: null, team2Name: null };

  const lowerTitle = title.toLowerCase();
  const teams = leagueKey
    ? allTeamConfigs.filter(team => team.leagueKey === leagueKey)
    : allTeamConfigs;
  const matches = [];

  teams.forEach(team => {
    const idPattern = team.id
      .split(/\s+/)
      .map(part => part.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
      .join('[\\s_-]+');
    const match = new RegExp(`(^|[^a-z0-9])(${idPattern})(?=$|[^a-z0-9])`).exec(lowerTitle);
    const idx = match ? match.index + match[1].length : -1;
    if (idx !== -1) {
      matches.push({
        index: idx,
        displayName: team.displayName,
        logo: team.imagePath
      });
    }
  });

  matches.sort((a, b) => a.index - b.index);

  const t1 = matches[0] || { displayName: null, logo: teamLogos.default };
  const t2 = matches[1] || { displayName: null, logo: teamLogos.default };

  return {
    selfLogo: t1.logo,
    oppLogo: t2.logo,
    team1Name: t1.displayName,
    team2Name: t2.displayName
  };
}

// Check if an event is active based on current selection
function isEventActive(leagueKey, title) {
  if (!activeLeagues.has(leagueKey)) return false;
  const matchup = getMatchupDetails(title, leagueKey);
  return (matchup.team1Name && activeTeams.has(matchup.team1Name)) ||
         (matchup.team2Name && activeTeams.has(matchup.team2Name));
}

let masterAllEvents = [];
let scheduleWeekOffset = 0;
let scheduleLeaderPlayersByTeam = new Map();
let scheduleStandingsByTeam = new Map();
let selectedScoreDateKey = null;
let selectedScheduleDateKey = null;
let scoreDateInitialized = false;
const gameSheetResults = new Map();
const gameSheetRequests = new Map();

document.addEventListener('DOMContentLoaded', function() {
  loadSavedFilters();
  buildFilterUI();
  initializeShowAllTeamsControl();
  setupStickySchedulePicker();
  fetchAllIcsEvents();
  if (GAME_PAGE_MODE === 'scores') {
    loadScheduleTeamLeaders();
    loadScheduleStandings();
  }
});

function escapeLeaderHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, character => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[character]);
}

function decodeLeaderEntities(value) {
  const textarea = document.createElement('textarea');
  textarea.innerHTML = String(value ?? '');
  return textarea.value;
}

function normalizeLeaderTeam(value) {
  return decodeLeaderEntities(value).toLowerCase().replace(/[^a-z0-9]/g, '');
}

function getLeaderTeam(player) {
  const rawValues = [
    player.teamName, player.team_name, player.team, player.Team,
    player.teamId, player.team_id, player.franchise, player.franchiseName,
    player.teamAbbreviation
  ];
  const values = rawValues.flatMap(value => {
    if (value && typeof value === 'object') {
      return [value.name, value.fullName, value.teamName, value.id, value.abbreviation, value.code];
    }
    return [value];
  }).map(normalizeLeaderTeam).filter(Boolean);

  return allTeamConfigs.find(team => {
    const identifiers = [team.displayName, team.id, ...team.statsAliases]
      .map(normalizeLeaderTeam).filter(Boolean);
    return values.some(value => identifiers.some(identifier => value === identifier ||
      (identifier.length >= 5 && value.includes(identifier))));
  });
}

function renderTeamLeader(team, player, metricKey, metricLabel) {
  if (!player) {
    return `<div class="team-leader-item team-leader-empty"><img src="${escapeLeaderHtml(team.imagePath)}" alt=""><span>${escapeLeaderHtml(team.displayName)} · No stats yet</span></div>`;
  }
  const name = decodeLeaderEntities(player.name || 'Unknown player');
  const value = Number(player[metricKey] || 0);
  const details = [
    team.abbreviation || team.displayName,
    player.number ? `#${player.number}` : '',
    player.position || ''
  ].filter(Boolean).join(' · ');

  return `<div class="team-leader-item">
    <img src="${escapeLeaderHtml(team.imagePath)}" alt="">
    <div class="team-leader-player"><strong>${escapeLeaderHtml(name)}</strong>${details ? `<span>${escapeLeaderHtml(details)}</span>` : ''}</div>
    <div class="team-leader-total"><strong>${escapeLeaderHtml(value)}</strong><span>${metricLabel}</span></div>
  </div>`;
}

async function loadScheduleTeamLeaders() {
  if (!SCHEDULE_STATS_API_URL) return;

  try {
    const response = await fetch(SCHEDULE_STATS_API_URL);
    if (!response.ok) throw new Error(`Stats request failed (${response.status})`);
    const stats = await response.json();
    const playersByTeam = new Map(allTeamConfigs.map(team => [team, []]));

    (stats.skaters || []).forEach(player => {
      const team = getLeaderTeam(player);
      if (team) playersByTeam.get(team).push(player);
    });

    scheduleLeaderPlayersByTeam = playersByTeam;
    if (masterAllEvents.length) renderListView();
  } catch (error) {
    console.error('Could not load schedule team leaders:', error);
    scheduleLeaderPlayersByTeam = new Map();
  }
}

function getConfiguredTeam(name, leagueKey) {
  const normalizedName = normalizeLeaderTeam(name);
  const eligibleTeams = allTeamConfigs.filter(team => !leagueKey || team.leagueKey === leagueKey);
  const exactMatch = eligibleTeams.find(team => {
    return [team.displayName, team.id, ...team.statsAliases]
      .map(normalizeLeaderTeam).some(identifier => identifier && identifier === normalizedName);
  });
  if (exactMatch) return exactMatch;

  return eligibleTeams.find(team => [team.displayName, team.id, ...team.statsAliases]
    .map(normalizeLeaderTeam)
    .some(identifier => identifier.length >= 5 && normalizedName.includes(identifier)));
}

function getTeamLeader(team, metricKey) {
  const players = scheduleLeaderPlayersByTeam.get(team) || [];
  return [...players].sort((a, b) =>
    Number(b[metricKey] || 0) - Number(a[metricKey] || 0) ||
    String(a.name || '').localeCompare(String(b.name || ''))
  )[0];
}

function getConfiguredStanding(team, rows) {
  return rows.find(row => {
    const rowName = normalizeLeaderTeam(row.Team);
    return [team.displayName, team.id, ...team.statsAliases]
      .map(normalizeLeaderTeam).some(identifier => identifier && (
        rowName === identifier || (identifier.length >= 5 && rowName.includes(identifier))
      ));
  });
}

async function loadScheduleStandings() {
  const divisions = Object.entries(LEAGUE_STRUCTURE);
  const results = await Promise.allSettled(divisions.map(async ([divisionKey, division]) => {
    const response = await fetch(division.standingsUrl);
    if (!response.ok) throw new Error(`Standings request failed (${response.status})`);
    const rows = await response.json();
    if (!Array.isArray(rows)) throw new Error('Unexpected standings response');
    return { divisionKey, division, rows };
  }));

  results.forEach((result, index) => {
    if (result.status !== 'fulfilled') {
      console.error(`Could not load ${divisions[index][1].name} standings for scores:`, result.reason);
      return;
    }
    const { division, rows } = result.value;
    division.teams.forEach(teamConfig => {
      const team = allTeamConfigs.find(candidate => candidate.leagueKey === result.value.divisionKey && candidate.displayName === teamConfig.name);
      if (team) {
        const standing = getConfiguredStanding(team, rows);
        if (standing) scheduleStandingsByTeam.set(team, standing);
      }
    });
  });

  if (GAME_PAGE_MODE === 'scores' && masterAllEvents.length) renderListView();
}

function formatScoreTeam(team) {
  if (!team) return '';
  const standing = scheduleStandingsByTeam.get(team);
  const record = standing
    ? `${standing.W || 0}-${standing.L || 0}-${standing.T || 0}`
    : 'Record unavailable';
  return `<div class="scores-game-team">
    <img src="${escapeLeaderHtml(team.imagePath)}" alt="">
    <div><strong>${escapeLeaderHtml(team.displayName)}</strong><span>${escapeLeaderHtml(record)}</span></div>
  </div>`;
}

function renderScoreCard(event, matchup) {
  const firstTeam = getConfiguredTeam(matchup.team1Name, event.leagueKey);
  const secondTeam = getConfiguredTeam(matchup.team2Name, event.leagueKey);
  const start = new Date(event.start);
  const isPastGame = start < new Date();
  const date = start.toLocaleDateString([], { month: 'short', day: 'numeric' });
  const time = start.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
  const cardKey = getScoreCardKey(event);
  const leaders = firstTeam && secondTeam ? [
    renderTeamLeader(firstTeam, getTeamLeader(firstTeam, 'g'), 'g', 'Goals'),
    renderTeamLeader(secondTeam, getTeamLeader(secondTeam, 'g'), 'g', 'Goals'),
    renderTeamLeader(firstTeam, getTeamLeader(firstTeam, 'a'), 'a', 'Assists'),
    renderTeamLeader(secondTeam, getTeamLeader(secondTeam, 'a'), 'a', 'Assists')
  ].join('') : '';

  return `<article class="scores-game-card${isPastGame ? ' scores-game-card-final' : ''}">
    <div class="scores-game-card-heading">
      <span class="scores-game-time"${isPastGame ? ` id="scores-game-status-${cardKey}"` : ''}>${escapeLeaderHtml(`${time} · ${date}`)}</span>
      <span class="scores-game-location">${escapeLeaderHtml(event.location || 'Location to be announced')}</span>
    </div>
    ${isPastGame
      ? `<div id="scores-game-result-${cardKey}" class="scores-game-result">${event.gameId ? 'Loading final score…' : renderPastGameUnavailable(matchup, 'Final score details could not be loaded.')}</div>`
      : `<div class="scores-game-teams">
          ${formatScoreTeam(firstTeam) || `<div class="scores-game-team"><img src="${escapeLeaderHtml(matchup.selfLogo)}" alt=""><div><strong>${escapeLeaderHtml(matchup.team1Name || 'Team 1')}</strong><span>Record unavailable</span></div></div>`}
          ${formatScoreTeam(secondTeam) || `<div class="scores-game-team"><img src="${escapeLeaderHtml(matchup.oppLogo)}" alt=""><div><strong>${escapeLeaderHtml(matchup.team2Name || 'Team 2')}</strong><span>Record unavailable</span></div></div>`}
        </div>
        ${leaders ? `<div class="scores-game-leaders"><h3>Team Leaders</h3><div class="scores-game-leader-grid">${leaders}</div></div>` : ''}`}
  </article>`;
}

function getScoreCardKey(event) {
  const raw = `${event.gameId || ''}-${new Date(event.start).getTime()}-${event.leagueKey || ''}`;
  return raw.replace(/[^a-z0-9_-]/gi, '-');
}

function fetchGameSheet(gameId) {
  if (gameSheetResults.has(gameId)) return Promise.resolve(gameSheetResults.get(gameId));
  if (gameSheetRequests.has(gameId)) return gameSheetRequests.get(gameId);

  const request = fetch(`${SCORE_SHEET_API_URL}?id=${encodeURIComponent(gameId)}`)
    .then(async response => {
      if (!response.ok) throw new Error(`Scoresheet request failed (${response.status})`);
      const result = await response.json();
      if (!Array.isArray(result.teams)) throw new Error('Scoresheet response is missing team results');
      gameSheetResults.set(gameId, result);
      return result;
    })
    .finally(() => gameSheetRequests.delete(gameId));
  gameSheetRequests.set(gameId, request);
  return request;
}

function renderPastGameDetails(result, event, matchup) {
  const fallbackTeams = [
    { name: matchup.team1Name, imagePath: matchup.selfLogo, side: 'away' },
    { name: matchup.team2Name, imagePath: matchup.oppLogo, side: 'home' }
  ];
  const teams = (result.teams || []).length ? result.teams : fallbackTeams;
  const teamMarkup = teams.map((team, index) => {
    const configuredTeam = getConfiguredTeam(team.name, event.leagueKey);
    const fallback = fallbackTeams.find(item => item.side === team.side) || fallbackTeams[index];
    const logo = configuredTeam?.imagePath || fallback?.imagePath || teamLogos.default;
    const shotText = team.shotsOnGoal === null || team.shotsOnGoal === undefined
      ? 'SOG unavailable'
      : `SOG: ${team.shotsOnGoal}`;
    const score = team.score === null || team.score === undefined ? '–' : team.score;
    return `<div class="scores-game-team scores-game-final-team">
      <img src="${escapeLeaderHtml(logo)}" alt="">
      <div><strong>${escapeLeaderHtml(team.name || fallback?.name || 'Team')}</strong><span>${escapeLeaderHtml(shotText)}</span></div>
      <strong class="scores-game-final-score">${escapeLeaderHtml(score)}</strong>
    </div>`;
  }).join('');

  const scorers = (result.goalScorers || []).filter(player =>
    player.name && Number(player.goals) > 0 && String(player.number || '').toLowerCase() !== 'totals:'
  );
  const scorerRows = teams.map(team => {
    const players = scorers.filter(player => String(player.team || '').toLowerCase() === String(team.name || '').toLowerCase());
    if (!players.length) return '';
    const names = players.map(player => `${player.name}${Number(player.goals) > 1 ? ` (${player.goals})` : ''}`).join(', ');
    return `<div class="scores-game-scorer-team"><strong>${escapeLeaderHtml(team.name)}</strong><span>${escapeLeaderHtml(names || 'No goals recorded')}</span></div>`;
  }).join('');

  return `<div class="scores-game-teams scores-game-final-teams">${teamMarkup}</div>
    <div class="scores-game-goal-scorers"><h3>Goals</h3>${scorerRows || '<p>No goal scorers reported.</p>'}</div>`;
}

function renderPastGameUnavailable(matchup, message) {
  const teams = [
    { name: matchup.team1Name || 'Team 1', imagePath: matchup.selfLogo },
    { name: matchup.team2Name || 'Team 2', imagePath: matchup.oppLogo }
  ];
  const teamRows = teams.map(team => `<div class="scores-game-team scores-game-final-team">
    <img src="${escapeLeaderHtml(team.imagePath)}" alt="">
    <div><strong>${escapeLeaderHtml(team.name)}</strong></div>
  </div>`).join('');
  return `<div class="scores-game-teams scores-game-final-teams">${teamRows}</div><p class="scores-game-load-error">${escapeLeaderHtml(message)}</p>`;
}

function completedGameLabel(status) {
  const normalized = String(status || '').toUpperCase().replace(/\s+/g, '');
  const finalMatch = normalized.match(/^FINAL(?:\/(OT|SO))?/);
  return finalMatch ? `FINAL${finalMatch[1] ? `/${finalMatch[1]}` : ''}` : null;
}

function renderScheduleGameResult(result, event, matchup) {
  const teams = result.teams || [];
  if (teams.length < 2 || teams.some(team => team.score === null || team.score === undefined)) {
    return 'Score unavailable';
  }
  const [first, second] = teams;
  const firstName = getTeamAbbreviation(first.name || matchup.team1Name, event.leagueKey);
  const secondName = getTeamAbbreviation(second.name || matchup.team2Name, event.leagueKey);
  const finalStatus = completedGameLabel(result.status);
  const overtimeSuffix = finalStatus === 'FINAL/OT' ? ' (OT)' : finalStatus === 'FINAL/SO' ? ' (SO)' : '';
  const firstIsWinner = Number(first.score) > Number(second.score);
  const secondIsWinner = Number(second.score) > Number(first.score);
  return `<span class="schedule-result-team${firstIsWinner ? ' winner' : ''}">${escapeLeaderHtml(firstName)} ${escapeLeaderHtml(first.score)}</span>, <span class="schedule-result-team${secondIsWinner ? ' winner' : ''}">${escapeLeaderHtml(secondName)} ${escapeLeaderHtml(second.score)}</span>${overtimeSuffix}`;
}

function getTeamAbbreviation(name, leagueKey) {
  return getConfiguredTeam(name, leagueKey)?.abbreviation || name;
}

function getIcsValue(component, propertyName) {
  const value = component.getFirstPropertyValue(propertyName);
  if (value === null || value === undefined) return '';
  return typeof value === 'string' ? value : String(value);
}

function extractGameIdFromIcs(vevent) {
  const values = ['url', 'description', 'uid'].map(name => getIcsValue(vevent, name));
  for (const value of values) {
    const linkedId = value.match(/\/game\/(?:game_sheet|show)\/(\d+)/i)?.[1];
    if (linkedId) return linkedId;
  }
  for (const value of values) {
    const numericId = value.match(/(?:^|[^\d])(\d{7,})(?:[^\d]|$)/)?.[1];
    if (numericId) return numericId;
  }
  return null;
}

function loadPastGameDetails(events) {
  events.filter(event => new Date(event.start) < new Date()).forEach(event => {
    const target = document.getElementById(`scores-game-result-${getScoreCardKey(event)}`);
    if (!target || !event.gameId) return;
    const matchup = getMatchupDetails(event.title, event.leagueKey);
    fetchGameSheet(event.gameId)
      .then(result => {
        const currentTarget = document.getElementById(`scores-game-result-${getScoreCardKey(event)}`);
        if (currentTarget) currentTarget.innerHTML = renderPastGameDetails(result, event, matchup);
        const statusLabel = completedGameLabel(result.status);
        const statusTarget = document.getElementById(`scores-game-status-${getScoreCardKey(event)}`);
        if (statusTarget && statusLabel) statusTarget.textContent = statusLabel;
      })
      .catch(error => {
        console.error(`Could not load scoresheet for game ${event.gameId}:`, error);
        const currentTarget = document.getElementById(`scores-game-result-${getScoreCardKey(event)}`);
        if (currentTarget) currentTarget.innerHTML = renderPastGameUnavailable(matchup, 'Final score details could not be loaded.');
      });
  });
}

function loadPastScheduleResults(events) {
  events.filter(event => new Date(event.start) < new Date()).forEach(event => {
    const targetId = `schedule-result-${getScoreCardKey(event)}`;
    const target = document.getElementById(targetId);
    if (!target) return;
    if (!event.gameId) {
      target.textContent = 'Score unavailable';
      return;
    }

    const matchup = getMatchupDetails(event.title, event.leagueKey);
    fetchGameSheet(event.gameId)
      .then(result => {
        const currentTarget = document.getElementById(targetId);
        if (currentTarget) currentTarget.innerHTML = renderScheduleGameResult(result, event, matchup);
      })
      .catch(error => {
        console.error(`Could not load schedule result for game ${event.gameId}:`, error);
        const currentTarget = document.getElementById(targetId);
        if (currentTarget) currentTarget.textContent = 'Score unavailable';
      });
  });
}

function buildFilterUI() {
  const filterContainer = document.getElementById('filter-controls');
  if (!filterContainer) return;

  let html = '';
  for (const [leagueKey, league] of Object.entries(LEAGUE_STRUCTURE)) {
    const leagueChecked = activeLeagues.has(leagueKey) ? 'checked' : '';
    const groupHidden = activeLeagues.has(leagueKey) ? '' : 'hidden';

    html += `
      <div class="filter-section">
        <div class="filter-title">
          <input type="checkbox" id="league-${leagueKey}" ${leagueChecked} onchange="toggleLeague('${leagueKey}', this.checked)">
          <label for="league-${leagueKey}">${league.name}</label>
        </div>
        <div class="team-checkboxes ${groupHidden}" id="teams-group-${leagueKey}">
    `;
    
    league.teams.forEach(team => {
      const imgPath = team.imagePath || teamLogos[team.name] || teamLogos.default;
      const teamChecked = activeTeams.has(team.name) ? 'checked' : '';
      const teamNameArgument = team.name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      html += `
        <label class="filter-label">
          <input type="checkbox" class="team-cb-${leagueKey}" value="${team.name}" ${teamChecked} onchange="toggleTeam('${teamNameArgument}', this.checked)">
          <span class="filter-check-indicator" aria-hidden="true"></span>
          <img src="${imgPath}" alt="${team.name}" class="filter-team-icon" />
          <span class="filter-team-name">${team.name}</span>
        </label>
      `;
    });

    html += `</div></div>`;
  }
  filterContainer.innerHTML = html;
}

function toggleLeague(leagueKey, isChecked) {
  if (isChecked) activeLeagues.add(leagueKey);
  else activeLeagues.delete(leagueKey);

  const groupEl = document.getElementById(`teams-group-${leagueKey}`);
  if (groupEl) {
    if (isChecked) groupEl.classList.remove('hidden');
    else groupEl.classList.add('hidden');
  }

  document.querySelectorAll(`.team-cb-${leagueKey}`).forEach(cb => {
    cb.checked = isChecked;
    if (isChecked) activeTeams.add(cb.value);
    else activeTeams.delete(cb.value);
  });

  saveFiltersToStorage();
  refreshViews();
}

function toggleTeam(teamName, isChecked) {
  if (isChecked) activeTeams.add(teamName);
  else activeTeams.delete(teamName);

  saveFiltersToStorage();
  refreshViews();
}

function initializeShowAllTeamsControl() {
  const control = document.getElementById('show-all-teams');
  const filterPanel = document.getElementById('filter-controls');
  if (!control || !filterPanel) return;

  control.checked = showAllTeamsMode;
  filterPanel.hidden = showAllTeamsMode;
}

function toggleShowAllTeams(showAll) {
  showAllTeamsMode = showAll;
  localStorage.setItem(STORAGE_KEY_SHOW_ALL_TEAMS, String(showAll));

  const filterPanel = document.getElementById('filter-controls');
  if (filterPanel) filterPanel.hidden = showAll;

  if (showAll) {
    activeLeagues.clear();
    activeTeams.clear();
    Object.entries(LEAGUE_STRUCTURE).forEach(([leagueKey, league]) => {
      activeLeagues.add(leagueKey);
      league.teams.forEach(team => activeTeams.add(team.name));
    });
    saveFiltersToStorage();
    buildFilterUI();
    refreshViews();
  }
}

window.addEventListener('puhl:schedule-theme-division-change', event => {
  const { divisionKey } = event.detail;
  const division = LEAGUE_STRUCTURE[divisionKey];
  if (!division) return;

  activeLeagues.clear();
  activeLeagues.add(divisionKey);
  activeTeams.clear();
  division.teams.forEach(team => activeTeams.add(team.name));
  showAllTeamsMode = false;
  localStorage.setItem(STORAGE_KEY_SHOW_ALL_TEAMS, 'false');

  const showAllControl = document.getElementById('show-all-teams');
  if (showAllControl) showAllControl.checked = false;
  const filterPanel = document.getElementById('filter-controls');
  if (filterPanel) filterPanel.hidden = false;
  buildFilterUI();
  saveFiltersToStorage();
  refreshViews();
});

function toggleScheduleFilters() {
  const filterSection = document.getElementById('schedule-filters');
  if (!filterSection) return;

  filterSection.hidden = !filterSection.hidden;
  updateFilterToggle(filterSection, filterSection.hidden);
}

function updateFilterToggle(filterSection, isHidden) {
  const toggle = document.getElementById('schedule-filter-toggle');
  if (!filterSection || !toggle) return;

  toggle.textContent = isHidden ? 'Show Filters' : 'Hide Filters';
  toggle.setAttribute('aria-expanded', String(!isHidden));
}

function refreshViews() {
  renderListView();
}

function getLocalDateKey(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function setupStickySchedulePicker() {
  const picker = document.querySelector('.schedule-date-picker');
  if (!picker) return;

  const updateStickyState = () => {
    const top = picker.getBoundingClientRect().top;
    picker.classList.toggle('is-stuck', Math.abs(top) <= 1);
  };
  window.addEventListener('scroll', updateStickyState, { passive: true });
  updateStickyState();
}

function scrollToScheduleDay(dateKey) {
  const dayGroup = document.getElementById(`schedule-day-${dateKey}`);
  const picker = document.querySelector('.schedule-date-picker');
  if (!dayGroup) return;

  const targetTop = dayGroup.getBoundingClientRect().top + window.scrollY - (picker?.offsetHeight || 0) - 12;
  window.scrollTo({ top: targetTop, behavior: 'smooth' });
}

function shiftScheduleWeek(amount) {
  const activeEvents = masterAllEvents
    .filter(event => isEventActive(event.leagueKey, event.title))
    .filter(event => event.start);
  const earliestEvent = activeEvents.reduce((earliest, event) =>
    !earliest || new Date(event.start) < earliest ? new Date(event.start) : earliest, null);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const earliestOffset = earliestEvent
    ? Math.min(0, Math.floor((new Date(earliestEvent.getFullYear(), earliestEvent.getMonth(), earliestEvent.getDate()) - today) / (7 * 24 * 60 * 60 * 1000)))
    : 0;
  const previousOffset = scheduleWeekOffset;
  scheduleWeekOffset = Math.max(earliestOffset, scheduleWeekOffset + amount);
  const offsetChange = scheduleWeekOffset - previousOffset;

  if (GAME_PAGE_MODE === 'scores' && selectedScoreDateKey && offsetChange) {
    const selectedDate = new Date(`${selectedScoreDateKey}T12:00:00`);
    selectedDate.setDate(selectedDate.getDate() + offsetChange * 7);
    selectedScoreDateKey = getLocalDateKey(selectedDate);
  }

  renderDaySelector(activeEvents);

  if (GAME_PAGE_MODE === 'scores') {
    renderListView();
    return;
  }

  const weekStart = new Date(today);
  weekStart.setDate(today.getDate() + scheduleWeekOffset * 7);
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate() + 7);
  const firstGameInWeek = activeEvents
    .filter(event => new Date(event.start) >= weekStart && new Date(event.start) < weekEnd)
    .sort((a, b) => new Date(a.start) - new Date(b.start))[0];
  selectedScheduleDateKey = firstGameInWeek ? getLocalDateKey(new Date(firstGameInWeek.start)) : null;
  renderListView();
  if (selectedScheduleDateKey) scrollToScheduleDay(selectedScheduleDateKey);
}

async function fetchAllIcsEvents() {
  masterAllEvents = [];

  const promises = Object.keys(LEAGUE_STRUCTURE).map(async leagueKey => {
    const url = LEAGUE_STRUCTURE[leagueKey].icsUrl;
    try {
      const response = await fetch(url);
      const icsText = await response.text();
      
      const jcalData = ICAL.parse(icsText);
      const comp = new ICAL.Component(jcalData);
      const vevents = comp.getAllSubcomponents('vevent');

      vevents.forEach(vevent => {
        const event = new ICAL.Event(vevent);
        masterAllEvents.push({
          title: event.summary,
          start: event.startDate.toJSDate(),
          location: event.location || 'TBD',
          gameId: extractGameIdFromIcs(vevent),
          leagueKey: leagueKey
        });
      });
    } catch (err) {
      console.error(`Error fetching ICS for ${leagueKey}:`, err);
    }
  });

  await Promise.all(promises);
  if (GAME_PAGE_MODE === 'scores' && !scoreDateInitialized) {
    initializeScoreDate(masterAllEvents.filter(event => isEventActive(event.leagueKey, event.title) && event.start));
  }
  renderListView();
}

function initializeScoreDate(events) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const todayKey = getLocalDateKey(today);
  const availableDates = Array.from(new Set(events.map(event => getLocalDateKey(new Date(event.start))))).sort();
  const nextDate = availableDates.find(dateKey => dateKey >= todayKey);
  const selectedDate = nextDate || availableDates[availableDates.length - 1] || todayKey;

  selectedScoreDateKey = selectedDate;
  scoreDateInitialized = true;

  // The picker uses rolling seven-day ranges beginning today. Open the range
  // containing the first available game so the selected date is visible.
  const selected = new Date(`${selectedDate}T12:00:00`);
  const dayDistance = Math.floor((Date.UTC(selected.getFullYear(), selected.getMonth(), selected.getDate()) -
    Date.UTC(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);
  scheduleWeekOffset = Math.max(0, Math.floor(dayDistance / 7));
}

function renderListView() {
  const container = document.getElementById('upcoming-games-container');
  if (!container) return;

  const filteredEvents = masterAllEvents.filter(e => isEventActive(e.leagueKey, e.title));
  const noFilteredEvents = filteredEvents.length === 0;

  const scheduledEvents = filteredEvents.filter(event => event.start);
  renderDaySelector(scheduledEvents);

  if (noFilteredEvents) {
    container.innerHTML = '<p>No games found matching the selected filters.</p>';
    return;
  }

  let visibleEvents;
  if (GAME_PAGE_MODE === 'scores') {
    visibleEvents = scheduledEvents.filter(event => getLocalDateKey(new Date(event.start)) === selectedScoreDateKey);
  } else {
    const weekStart = new Date();
    weekStart.setHours(0, 0, 0, 0);
    weekStart.setDate(weekStart.getDate() + scheduleWeekOffset * 7);
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 7);
    visibleEvents = scheduledEvents.filter(event => {
      const eventDate = new Date(event.start);
      return eventDate >= weekStart && eventDate < weekEnd;
    });
  }

  if (visibleEvents.length === 0) {
    const selectedDate = selectedScoreDateKey
      ? new Date(`${selectedScoreDateKey}T12:00:00`).toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' })
      : '';
    container.innerHTML = GAME_PAGE_MODE === 'scores' && selectedDate
      ? `<p>No games scheduled for ${escapeLeaderHtml(selectedDate)}.</p>`
      : GAME_PAGE_MODE === 'schedule'
        ? '<p>No games scheduled this week.</p>'
        : '<p>No games scheduled.</p>';
    return;
  }

  visibleEvents.sort((a, b) => new Date(a.start) - new Date(b.start));

  const grouped = {};
  visibleEvents.forEach(e => {
    const dateKey = getLocalDateKey(new Date(e.start));
    if (!grouped[dateKey]) grouped[dateKey] = [];
    grouped[dateKey].push(e);
  });

  let html = '';
  for (const dateKey in grouped) {
    const hasPastGames = grouped[dateKey].some(event => new Date(event.start) < new Date());
    const date = new Date(`${dateKey}T12:00:00`).toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    html += `<div class="date-group${GAME_PAGE_MODE === 'scores' ? ' scores-date-group' : ''}" id="schedule-day-${dateKey}">
      <h3 class="date-header">${date}</h3>`;

    if (GAME_PAGE_MODE === 'scores') {
      html += '<div class="scores-game-grid">';
      grouped[dateKey].forEach(event => {
        const matchup = getMatchupDetails(event.title, event.leagueKey);
        html += renderScoreCard(event, matchup);
      });
      html += '</div></div>';
      continue;
    }

    html += `
      <table class="schedule-table league-matchup-table">
        <thead>
          <tr>
            <th style="width: ${hasPastGames ? '37%' : '45%'};">Matchup</th>
            ${hasPastGames ? '<th style="width: 19%;">Result</th>' : ''}
            <th style="width: ${hasPastGames ? '15%' : '20%'};">Division</th>
            <th style="width: ${hasPastGames ? '13%' : '15%'};">Time</th>
            <th style="width: ${hasPastGames ? '16%' : '20%'};">Location</th>
          </tr>
        </thead>
        <tbody>
    `;

    grouped[dateKey].forEach(event => {
      const timeStr = new Date(event.start).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      const matchup = getMatchupDetails(event.title, event.leagueKey);
      const isPastGame = new Date(event.start) < new Date();

      html += `
        <tr>
          <td>
            <div class="matchup-cell">
              <span class="team-name">${matchup.team1Name || 'Team 1'}</span>
              <img src="${matchup.selfLogo}" alt="${matchup.team1Name || 'Team 1'}" />
              <span class="matchup-at">@</span>
              <img src="${matchup.oppLogo}" alt="${matchup.team2Name || 'Team 2'}" />
              <span class="team-name">${matchup.team2Name || 'Team 2'}</span>
            </div>
          </td>
          ${hasPastGames ? `<td class="result-cell${isPastGame ? ' past-game-result' : ''}">${isPastGame
            ? `<span id="schedule-result-${getScoreCardKey(event)}">${event.gameId ? 'Loading…' : 'Score unavailable'}</span>`
            : ''}</td>` : ''}
          <td class="division-cell">${LEAGUE_STRUCTURE[event.leagueKey]?.name || ''}</td>
          <td class="time-cell">${timeStr}</td>
          <td class="location-cell">${event.location}</td>
        </tr>
      `;
    });

    html += `</tbody></table></div>`;
  }
  container.innerHTML = html;
  if (GAME_PAGE_MODE === 'scores') loadPastGameDetails(visibleEvents);
  else loadPastScheduleResults(visibleEvents);
}

function renderDaySelector(events) {
  const selector = document.getElementById('day-selector');
  const weekLabel = document.getElementById('schedule-week-label');
  const previousButton = document.getElementById('previous-schedule-week');
  if (!selector || !weekLabel) return;

  const eventCounts = {};
  events.forEach(event => {
    const key = getLocalDateKey(new Date(event.start));
    eventCounts[key] = (eventCounts[key] || 0) + 1;
  });

  const firstDay = new Date();
  firstDay.setHours(0, 0, 0, 0);
  firstDay.setDate(firstDay.getDate() + scheduleWeekOffset * 7);
  const lastDay = new Date(firstDay);
  lastDay.setDate(firstDay.getDate() + 6);
  const currentWeekKeys = Array.from({ length: 7 }, (_, index) => {
    const day = new Date(firstDay);
    day.setDate(firstDay.getDate() + index);
    return getLocalDateKey(day);
  });
  const weekGameKeys = currentWeekKeys.filter(key => eventCounts[key]);
  if (GAME_PAGE_MODE === 'schedule' && !weekGameKeys.includes(selectedScheduleDateKey)) {
    selectedScheduleDateKey = weekGameKeys[0] || null;
  }
  const formatRangeDate = date => date.toLocaleDateString([], { month: 'short', day: 'numeric' });
  weekLabel.textContent = `${formatRangeDate(firstDay)} – ${formatRangeDate(lastDay)}`;
  const validEvents = events.filter(event => event.start);
  const earliestEvent = validEvents.reduce((earliest, event) =>
    !earliest || new Date(event.start) < earliest ? new Date(event.start) : earliest, null);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const earliestOffset = earliestEvent
    ? Math.min(0, Math.floor((new Date(earliestEvent.getFullYear(), earliestEvent.getMonth(), earliestEvent.getDate()) - today) / (7 * 24 * 60 * 60 * 1000)))
    : 0;
  if (previousButton) previousButton.disabled = scheduleWeekOffset <= earliestOffset;

  selector.innerHTML = Array.from({ length: 7 }, (_, index) => {
    const day = new Date(firstDay);
    day.setDate(firstDay.getDate() + index);
    const key = getLocalDateKey(day);
    const count = eventCounts[key] || 0;
    const isSelected = GAME_PAGE_MODE === 'scores'
      ? key === selectedScoreDateKey
      : key === selectedScheduleDateKey;
    const clickHandler = GAME_PAGE_MODE === 'scores'
      ? `selectScoreDate('${key}')`
      : `selectScheduleDate('${key}')`;
    return `<button type="button" class="schedule-day-option ${count ? '' : 'no-games'}${isSelected ? ' selected' : ''}" ${count ? `onclick="${clickHandler}"` : 'disabled'} aria-label="${day.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' })}: ${count} games"${isSelected ? ' aria-current="date"' : ''}>
      <span class="schedule-day-name">${day.toLocaleDateString([], { weekday: 'short' })}</span>
      <span class="schedule-day-date">${day.getDate()}</span>
      <span class="schedule-day-count">${count}</span>
    </button>`;
  }).join('');
}

function selectScoreDate(dateKey) {
  selectedScoreDateKey = dateKey;
  renderListView();
}

function selectScheduleDate(dateKey) {
  selectedScheduleDateKey = dateKey;
  renderListView();
  scrollToScheduleDay(dateKey);
}
</script>
